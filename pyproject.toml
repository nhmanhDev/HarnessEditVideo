[project]
name = "harness-edit-video"
version = "0.1.0"
description = "Agent dựng video: đọc video nguồn, lập kế hoạch bằng Claude, dựng bằng ffmpeg."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "gdown>=5.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
edit-agent = "edit_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edit_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Chuỗi JS/CSS nhúng trong HTML của lớp chữ chuyển động dài hơn 110 ký tự.
"src/edit_agent/motion_hf.py" = ["E501"]
