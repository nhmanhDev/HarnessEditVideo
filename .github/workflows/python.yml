name: Python

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Cài ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Cài môi trường
        run: uv sync --extra dev --python 3.12
      - name: Lint
        run: uv run ruff check src tests
      - name: Kiểm định dạng
        run: uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q
