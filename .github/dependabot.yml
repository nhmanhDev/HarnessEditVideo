# Cập nhật phụ thuộc tự động. Chưa kiểm trên GitHub: nếu Dependabot báo lỗi ecosystem `uv`, đổi sang `pip`.
# Repo không dùng npm hoặc docker thì xoá khối tương ứng.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
